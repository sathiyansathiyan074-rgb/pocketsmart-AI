{% extends "base.html" %}

{% block title %}
Register · PocketSmart
{% endblock %}

{% block content %}

<div class="auth-wrap">

    <div class="auth-card">

        <p class="eyebrow">
            POCKETSMART
        </p>

        <h1>
            Create Your Account
        </h1>

        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <form method="post">

            <label>
                Username

                <input
                    type="text"
                    name="username"
                    required
                    minlength="3"
                    placeholder="Choose a username"
                >

            </label>


            <label>
                Email

                <input
                    type="email"
                    name="email"
                    required
                    placeholder="Enter your email"
                >

            </label>


            <label>
                Password

                <input
                    type="password"
                    name="password"
                    required
                    minlength="6"
                    placeholder="Create a strong password"
                >

            </label>


            <label>
                Confirm Password

                <input
                    type="password"
                    name="confirm_password"
                    required
                    minlength="6"
                    placeholder="Confirm your password"
                >

            </label>


            <button
                class="btn full"
                type="submit"
            >
                Create Account ✦
            </button>

        </form>


        <p class="center">

            Already have an account?

            <a href="/login">
                Sign In
            </a>

        </p>

    </div>

</div>

{% endblock %}
